id: 0580.e2.1.index_multiply
syllabus: E2.1
tier: extended
title: Multiplying powers with the same base
statement: "Write {expr} as a single power of {base}."
display: "{base}^{p} × {base}^{q}"
answer: "{base}**{p} * {base}**{q}"
answer_form: exact
transform: powsimp
rationale: "E2.1: a^m × a^n = a^(m+n)."
params:
  base: { dist: choice, options: [2, 3, 5, 7] }
  p: { dist: int, range: [1, 6] }
  q: { dist: int, range: [1, 6] }
  total: { dist: derive, template: "{p} + {q}" }
steps:
  - "Add the powers because the bases match: {p} + {q} = {total}."
  - "So the answer is {base} to the power {total}."