id: 0580.c5.2.midpoint
syllabus: C5.2
tier: core
title: Midpoint of a line segment
statement: "Find the midpoint of the line joining ({x1}, {y1}) and ({x2}, {y2})."
answer: "(({x1}+{x2})/2, ({y1}+{y2})/2)"
answer_form: pair
transform: simplify
rationale: "C5.2: average each coordinate. The answer is an ordered pair, not a set."
params:
  x1: { dist: int, range: [-10, 6] }
  y1: { dist: int, range: [-10, 10] }
  x2: { dist: int, range: [7, 15] }
  y2: { dist: int, range: [-10, 10] }
  y2s: { dist: sign, from: y2, plus: "+ {}", minus: "- {}" }
  y2n: { dist: sign, from: y2, plus: "{}", minus: "({})", signed: true }
steps:
  - "Average the x coordinates: ({x1} + {x2})/2."
  - "Average the y coordinates: ({y1} {y2s})/2."