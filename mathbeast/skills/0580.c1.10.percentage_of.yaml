id: 0580.c1.10.percentage_of
syllabus: C1.10
tier: core
title: Percentage of a quantity
statement: "Find {p}% of {n}."
answer: "{p}*{n}/100"
answer_form: exact
transform: exact
rationale: "C1.10: use percentages in an appropriate context."
params:
  p: { dist: choice, options: [10, 20, 25, 30, 40, 50, 60, 70, 75, 80] }
  k: { dist: choice, options: [4, 5, 6, 7, 8, 9, 10, 12, 15, 20, 25] }
  n: { dist: derive, template: "20*{k}" }
steps:
  - "Find 1% of {n}: {n}/100."
  - "Multiply by {p} to get {p}% of {n}."