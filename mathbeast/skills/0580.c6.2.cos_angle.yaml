id: 0580.c6.2.cos_angle
syllabus: C6.2
tier: core
title: Finding cosine of an angle
statement: "In a right-angled triangle the side opposite the marked angle is {o}, the adjacent side is {a}, and the hypotenuse is {c}. Find cos of the marked angle to 3 significant figures."
answer: "{a}/{c}"
answer_form: rounded
spec: "3sf"
transform: numeric
rationale: "C6.2: cos = adjacent / hypotenuse."
params:
  o: { dist: int, range: [2, 20] }
  a: { dist: int, range: [2, 20] }
  c: { dist: derive, template: "sqrt({o}**2 + {a}**2)" }
steps:
  - "cos is the adjacent side divided by the hypotenuse."
  - "So cos = {a}/{c}."