id: 0580.c1.12.ratio_share
syllabus: C1.12
tier: core
title: Sharing in a given ratio
statement: "Three people share {total} in the ratio {a} : {b} : {c}. How much does the second person receive?"
answer: "{b}*{total}/({a}+{b}+{c})"
answer_form: exact
transform: exact
rationale: "C1.12: ratio and proportion. Add to get the total number of parts, then scale."
params:
  a: { dist: choice, options: [2, 3, 4, 5] }
  b: { dist: choice, options: [1, 2, 6, 7] }
  c: { dist: choice, options: [1, 3, 8] }
  total: { dist: choice, options: [60, 120, 240, 300, 480] }
steps:
  - "Total parts: {a} + {b} + {c} = {a}+{b}+{c}."
  - "Value of one part: {total}/({a}+{b}+{c})."
  - "The second person has {b} parts."