id: 0580.c4.2.pythagoras_short_side
syllabus: C4.2
tier: core
title: Pythagoras, finding a shorter side
statement: "A right-angled triangle has a hypotenuse of {c} cm and one side of {a} cm. Find the other side, giving your answer to 3 significant figures."
answer: "sqrt({c}**2 - {a}**2)"
answer_form: rounded
spec: "3sf"
transform: numeric
rationale: "C4.2: subtract, then take the square root. The triple is chosen as a unit so the sides are consistent and the radicand is always positive."
params:
  triple:
    dist: choice
    options:
      - [3, 4, 5]
      - [4, 3, 5]
      - [12, 5, 13]
      - [5, 12, 13]
      - [8, 15, 17]
      - [15, 8, 17]
      - [7, 24, 25]
      - [24, 7, 25]
      - [20, 21, 29]
      - [21, 20, 29]
      - [12, 16, 20]
      - [16, 12, 20]
  a: { dist: index, from: triple, at: 0 }
  c: { dist: index, from: triple, at: 2 }
steps:
  - "Square the hypotenuse and subtract the square of the known side."
  - "Take the square root to find the missing side."