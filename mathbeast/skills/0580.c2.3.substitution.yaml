id: 0580.c2.3.substitution
syllabus: C2.3
tier: core
title: Substituting into an expression
statement: "Find the value of {a}{v}^2 + {b} when {v} = {xval}."
answer: "{a}*{xval}**2 + {b}"
answer_form: exact
transform: exact
rationale: "C2.3: substitute numbers for letters in formulae."
params:
  v: { dist: const, value: x }
  a: { dist: int, range: [2, 9] }
  b: { dist: int, range: [-15, 15] }
  xval: { dist: int, range: [-6, 9] }
steps:
  - "Replace every {v} with {xval}."
  - "Work out the square, then multiply by {a}, then add {b}."