id: 0580.c6.1.sin_angle
syllabus: C6.1
tier: core
title: Finding sine of an angle
statement: "In a right-angled triangle the side opposite the marked angle is {o}, the adjacent side is {a}, and the hypotenuse is {c}. Find sin of the marked angle to 3 significant figures."
answer: "{o}/({c})"
answer_form: rounded
spec: "3sf"
transform: numeric
rationale: "C6.1: sin = opposite / hypotenuse."
params:
  # Each triple is ordered (opposite, adjacent, hypotenuse), so the same list
  # gives variety in which leg is which while keeping the three sides
  # consistent. Drawing them independently produced 10/2*sqrt(34), which
  # parses left to right as 29.2 -- a sine of 29.2.
  triple:
    dist: choice
    options:
      - [3, 4, 5]
      - [4, 3, 5]
      - [12, 5, 13]
      - [5, 12, 13]
      - [8, 15, 17]
      - [15, 8, 17]
      - [7, 24, 25]
      - [24, 7, 25]
      - [20, 21, 29]
      - [21, 20, 29]
      - [12, 16, 20]
      - [16, 12, 20]
  o: { dist: index, from: triple, at: 0 }
  a: { dist: index, from: triple, at: 1 }
  c: { dist: index, from: triple, at: 2 }
steps:
  - "sin is the opposite side divided by the hypotenuse."
  - "So sin = {o}/{c}."