id: 0580.c6.3.tan_angle
syllabus: C6.3
tier: core
title: Finding tangent of an angle
statement: "In a right-angled triangle the side opposite the marked angle is {o}, the adjacent side is {a}, and the hypotenuse is {c}. Find tan of the marked angle to 3 significant figures."
answer: "{o}/({a})"
answer_form: rounded
spec: "3sf"
transform: numeric
rationale: "C6.3: tan = opposite / adjacent. The hypotenuse is not needed."
params:
  triple:
    dist: choice
    options:
      - [3, 4, 5]
      - [4, 3, 5]
      - [12, 5, 13]
      - [5, 12, 13]
      - [8, 15, 17]
      - [15, 8, 17]
      - [7, 24, 25]
      - [24, 7, 25]
      - [20, 21, 29]
      - [21, 20, 29]
      - [12, 16, 20]
      - [16, 12, 20]
  o: { dist: index, from: triple, at: 0 }
  a: { dist: index, from: triple, at: 1 }
  c: { dist: index, from: triple, at: 2 }
steps:
  - "tan is the opposite side divided by the adjacent side."
  - "So tan = {o}/{a}."