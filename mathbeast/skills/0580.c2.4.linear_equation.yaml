id: 0580.c2.4.linear_equation
syllabus: C2.4
tier: core
title: Solving a linear equation
statement: "Solve {expr} for {v}."
display: "{a}{v} {bs} = {c}"
answer: "{a}*{v} + {b} - {c}"
answer_form: set
transform: solve
rationale: "C2.4: rearrange to make the subject the unknown."
params:
  v: { dist: const, value: x }
  xval: { dist: int, range: [-12, 15] }
  a: { dist: int, range: [2, 9] }
  b: { dist: int, range: [-15, 15] }
  bs: { dist: sign, from: b, plus: "+ {}", minus: "- {}" }
  bn: { dist: sign, from: b, plus: "{}", minus: "({})", signed: true }
  c: { dist: derive, template: "{a}*{xval} + {b}" }
steps:
  - "Move the constant across: {a}{v} = {c} - {bn}."
  - "Divide both sides by {a}."
  - "So {v} = {xval}."