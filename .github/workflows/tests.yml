name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS included deliberately: the audience for a
        # pip-installable local tool is not on Windows, and a canary that only
        # ever runs on Linux proves nothing about the other two.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # .[dev,web], not .[dev]: fastapi lives in the web extra, and
      # test_web.py importorskips it -- so a dev-only install meant the whole
      # web surface passed CI by never being collected. The extra also carries
      # python-multipart, without which every form POST raises.
      - run: pip install -e ".[dev,web]"
      - name: Report the CAS version the guarantee rests on
        run: python -c "import sympy; print('sympy', sympy.__version__)"
      - run: pytest -q
      # tests/test_capture.py skips here and that is deliberate, not an
      # oversight to fix. It diffs the render against a design reference that
      # is a drawing and lives outside the repository on purpose, so this job
      # has no image to compare against; installing the harness extra would
      # only add a browser download to every run to reach a skip. It is run by
      # hand -- see the README's "pixel harness, and why it is manual".
