[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathbeast"
version = "0.1.0"
description = "A verified maths engine. Problems are generated by code, answers are verified by code, and the model only explains."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
narrate = ["requests>=2.31"]
# python-multipart is FastAPI's own requirement for reading a form body, and
# form bodies are how every POST on this surface arrives. Without it
# `request.form()` raises, so it is not optional in the same way uvicorn is not.
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
mathbeast = "mathbeast.cli:main"

[tool.setuptools.packages.find]
include = ["mathbeast*"]

[tool.setuptools.package-data]
mathbeast = [
    "skills/**/*.yaml",
    "web/templates/*.html",
    "web/static/*.css",
    "web/static/*.js",
    "web/static/vendor/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"