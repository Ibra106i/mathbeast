[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathbeast"
version = "0.1.0"
description = "A verified maths engine. Problems are generated by code, answers are verified by code, and the model only explains."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
narrate = ["requests>=2.31"]

[project.scripts]
mathbeast = "mathbeast.cli:main"

[tool.setuptools.packages.find]
include = ["mathbeast*"]

[tool.setuptools.package-data]
mathbeast = ["skills/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"